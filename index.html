
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Expense Tracker</h1>
      <p>Manage your money, one transaction at a time.</p>
    </header>

    <section class="summary">
      <div class="card balance">
        <p>Total Balance</p>
        <h2 id="balance">₹0.00</h2>
      </div>
      <div class="card income">
        <p>Total Income</p>
        <h2 id="income">₹0.00</h2>
      </div>
      <div class="card expense">
        <p>Total Expenses</p>
        <h2 id="expense">₹0.00</h2>
      </div>
    </section>

    <section class="panel">
      <h2>Add Transaction</h2>
      <form id="transaction-form">
        <label for="description">Description</label>
        <input id="description" type="text"
          placeholder="e.g. College books" required>

        <label for="amount">Amount (₹)</label>
        <input id="amount" type="number" min="0.01"
          step="0.01" placeholder="Enter amount" required>

        <label for="type">Transaction Type</label>
        <select id="type" required>
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>

        <label for="category">Category</label>
        <select id="category" required>
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Education">Education</option>
          <option value="Shopping">Shopping</option>
          <option value="Bills">Bills</option>
          <option value="Salary">Salary</option>
          <option value="Other">Other</option>
        </select>

        <button type="submit">Add Transaction</button>
      </form>
    </section>

    <section class="panel">
      <div class="history-header">
        <h2>Transaction History</h2>
        <select id="filter">
          <option value="all">All Transactions</option>
          <option value="income">Income Only</option>
          <option value="expense">Expenses Only</option>
        </select>
      </div>
      <ul id="transaction-list"></ul>
      <p id="empty-message">No transactions yet. Add your first one!</p>
    </section>

    <footer>
      <p>Personal Expense Tracker | Built with HTML, CSS & JavaScript</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
